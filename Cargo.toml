[package]
name = "divedb"
version = "0.1.0"
authors = ["cetra3 <cetra3@hotmail.com>"]
edition = "2024"
license = "AGPL-3.0"

[workspace]
members = ["divedb_macro", "divedb_core"]

[[bin]]
name = "divedb"
path = "src/main.rs"

[dependencies]
serde = "1.0.229"
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["serde", "v4", "v5"] }
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.53", features = ["full", "tracing"] }
actix-web = "4.17.0"
actix-multipart = "0.8.5"
actix-files = "0.7.0"
async-graphql = { version = "7.2", features = ["uuid", "chrono", "tracing"] }
async-graphql-actix-web = "7.2"

deadpool = "0.13.1"
deadpool-postgres = "0.14.2"

futures = "0.3"
scrypt = { version = "0.12", features = ["phc", "getrandom"] }
aes-gcm = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
git2 = { version = "0.21.0", features = ["https"] }
async-trait = "0.1.92"
dataloader = { version = "0.18.0", default-features = false, features = [
    "runtime-tokio",
] }
tokio-postgres = { version = "0.7", features = [
    "with-chrono-0_4",
    "with-uuid-1",
] }
postgres-types = { version = "0.2", features = ["derive"] }
bytes = "1.12"
kamadak-exif = "0.6.1"
reqwest = { version = "0.12.28", features = ["json"] }
sitemap = "0.4.1"
twoway = "0.2.2"
image = "0.25"
imageproc = "0.27.0"
pulldown-cmark = "0.13.4"
once_cell = "1.21.4"
divedb_core = { path = "divedb_core" }
tantivy = "0.26.2"
scraper = "0.27.0"
mrml = "6.0"
lettre = { version = "0.11.23", features = [
    "tokio1-native-tls",
    "smtp-transport",
    "pool",
    "native-tls",
    "hostname",
    "builder",
] }
governor = "0.10.4"
askama = "0.16.1"
webp = "0.3.1"
activitypub_federation = { default-features = false, version = "0.6.6", features = [
    "actix-web",
] }
url = { version = "2.5.8", features = ["serde"] }
enum_delegate = "0.2.0"
resvg = "0.48.1"

tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
anyhow = { version = "1.0.104", features = ["backtrace"] }
foyer = { version = "0.22", features = ["serde"] }
dive-deco = "6.1.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
openidconnect = "4.0.1"
tempfile = "3.27.0"
dotenvy = "0.15.7"
ab_glyph = "0.2.32"
